<!DOCTYPE html>
<!-- Link-preview image template. Render with scripts/og_image. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Caveat"; font-weight: 600; src: url("../assets/fonts/Caveat-600-latin.woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 400; src: url("../_fonts-src/Pretendard-Regular.woff2"); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    display: flex; flex-direction: column;
    padding: 96px 110px 0; background: #1c5c46; color: #fcfcf9;
    font-family: "Pretendard", sans-serif; border-bottom: 14px solid #164a38;
  }
  .title { margin: 0 0 0 16px; font: 600 168px/1 "Caveat", cursive; }
  .lede { margin: 44px 0 0; color: #cfe3d9; font-size: 40px; line-height: 1.45; letter-spacing: -0.01em; }
  .foot { margin-top: auto; padding-bottom: 96px; color: #cfe3d9; font-size: 30px; }
</style>
</head>
<body>
  <p class="title">Gnod</p>
  <p class="lede" id="lede"></p>
  <div class="foot"><span id="name"></span></div>
  <script>
    var copy = {
      ko: { lede: "소프트웨어 엔지니어 박동연입니다.<br>만들고, 배우고, 생각한 것들을 기록합니다.", name: "박동연" },
      en: { lede: "I'm Dongyeon, a software engineer in South Korea.<br>I write about what I build, learn, and think about.", name: "Dongyeon Park" }
    }[location.hash.slice(1) || "ko"];
    document.documentElement.lang = location.hash.slice(1) || "ko";
    document.getElementById("lede").innerHTML = copy.lede;
    document.getElementById("name").textContent = copy.name;
  </script>
</body>
</html>
