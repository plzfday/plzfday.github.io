---
layout: default
---

<article>
  {% assign primary_category = page.categories | first %}
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y-%m-%d" }}
      </time>
      {% if primary_category %}
        · {{ primary_category | replace: "-", " " | replace: "_", " " | capitalize }}
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
