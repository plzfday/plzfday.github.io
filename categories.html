<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ '/archive/' | relative_url }}">
    <link rel="canonical" href="{{ '/archive/' | relative_url }}">
    <script>
      var match = location.hash.match(/^#category-(.+)$/);
      location.replace("{{ '/archive/' | relative_url }}" + (match ? "?category=" + match[1] : ""));
    </script>
  </head>
  <body>
    <p>Moved to <a href="{{ '/archive/' | relative_url }}">Posts</a>.</p>
  </body>
</html>
